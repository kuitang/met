name: Security inventory
on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 2'
permissions:
  contents: read
jobs:
  deployed-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Record all deployed image digests
        run: |
          mkdir -p security-inventory
          flyctl machine list -a musewalk --json | jq '[.[] | {id,state,image_ref}]' > security-inventory/machines.json
          jq -r '.[].image_ref | "registry.fly.io/musewalk@" + .digest' security-inventory/machines.json | sort -u > security-inventory/images.txt
          test -s security-inventory/images.txt
          flyctl auth docker
      - name: Install Trivy
        run: |
          curl -fsSL https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz -o /tmp/trivy.tar.gz
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
      - name: Scan exact serving artifacts and produce SBOMs
        run: |
          i=0
          while read -r image; do
            /tmp/trivy image --format cyclonedx --output "security-inventory/image-$i.cdx.json" "$image"
            /tmp/trivy image --scanners vuln --format json --output "security-inventory/image-$i.vulnerabilities.json" "$image"
            i=$((i + 1))
          done < security-inventory/images.txt
      - name: Alert on fixable high or critical image vulnerabilities
        run: |
          # Complete reports above retain unfixed and lower-severity findings.
          while read -r image; do
            /tmp/trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done < security-inventory/images.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-security-inventory
          path: security-inventory/
          retention-days: 30
